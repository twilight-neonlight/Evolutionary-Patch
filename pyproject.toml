[project]
name = "evopatch"
version = "0.1.0"
description = "Test-fitness evolutionary patch generation"
requires-python = ">=3.12"
dependencies = ["httpx", "pyyaml", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
